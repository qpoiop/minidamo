<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- GameBoy DMG palette -->
  <rect width="64" height="64" fill="#0f380f"/>
  <!-- outer border pixel -->
  <rect x="4" y="4" width="56" height="56" fill="#9bbc0f"/>
  <rect x="8" y="8" width="48" height="48" fill="#0f380f"/>
  <!-- letter "m" pixel-art (5x7 grid mapped into 30x42) -->
  <g fill="#c7e06a">
    <!-- Two-humped m -->
    <rect x="14" y="18" width="6" height="6"/>
    <rect x="20" y="18" width="6" height="6"/>
    <rect x="26" y="18" width="6" height="6"/>
    <rect x="32" y="18" width="6" height="6"/>
    <rect x="38" y="18" width="6" height="6"/>
    <rect x="44" y="18" width="6" height="6"/>
    <rect x="14" y="24" width="6" height="6"/>
    <rect x="26" y="24" width="6" height="6"/>
    <rect x="38" y="24" width="6" height="6"/>
    <rect x="44" y="24" width="6" height="6"/>
    <rect x="14" y="30" width="6" height="6"/>
    <rect x="26" y="30" width="6" height="6"/>
    <rect x="38" y="30" width="6" height="6"/>
    <rect x="44" y="30" width="6" height="6"/>
    <rect x="14" y="36" width="6" height="6"/>
    <rect x="26" y="36" width="6" height="6"/>
    <rect x="38" y="36" width="6" height="6"/>
    <rect x="44" y="36" width="6" height="6"/>
    <rect x="14" y="42" width="6" height="6"/>
    <rect x="26" y="42" width="6" height="6"/>
    <rect x="38" y="42" width="6" height="6"/>
    <rect x="44" y="42" width="6" height="6"/>
  </g>
  <!-- accent bottom bar -->
  <rect x="14" y="50" width="36" height="4" fill="#8bac0f"/>
</svg>
