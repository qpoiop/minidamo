<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 물고기 · 옆모습 · 몸통 · 눈 · 지느러미 · 꼬리 -->
  <defs>
    <linearGradient id="fish-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7e06a"/>
      <stop offset="0.5" stop-color="#8bac0f"/>
      <stop offset="1" stop-color="#5a7a10"/>
    </linearGradient>
  </defs>
  <!-- 꼬리 -->
  <path d="M4,24 L12,16 L14,24 L12,32 Z" fill="url(#fish-body)" stroke="#0a260a" stroke-width="2"/>
  <!-- 몸통 (레몬 모양) -->
  <path d="M12,24 Q12,10 30,10 Q42,12 42,24 Q42,36 30,38 Q12,38 12,24 Z" fill="url(#fish-body)" stroke="#0a260a" stroke-width="2"/>
  <!-- 등지느러미 -->
  <path d="M22,10 L26,4 L30,10 Z" fill="url(#fish-body)" stroke="#0a260a" stroke-width="1.5"/>
  <!-- 배지느러미 -->
  <path d="M22,36 L26,42 L30,36 Z" fill="url(#fish-body)" stroke="#0a260a" stroke-width="1.5"/>
  <!-- 눈 큰 원 (흰자) -->
  <circle cx="36" cy="20" r="3" fill="#c7e06a" stroke="#0a260a" stroke-width="1.2"/>
  <!-- 눈동자 -->
  <circle cx="37" cy="20" r="1.3" fill="#0a260a"/>
  <!-- 눈 반사 -->
  <circle cx="37.5" cy="19.5" r="0.5" fill="#fff"/>
  <!-- 입 -->
  <path d="M42,26 Q40,28 42,30" fill="none" stroke="#0a260a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 아가미 라인 -->
  <path d="M28,14 Q30,24 28,34" fill="none" stroke="#0a260a" stroke-width="1.2" opacity="0.6"/>
</svg>
