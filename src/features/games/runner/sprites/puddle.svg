  </defs>
  <!-- 튀김 방울 (바깥) -->
  <circle cx="6"  cy="18" r="2" fill="#6a97d8" stroke="#0a260a" stroke-width="1"/>
  <circle cx="42" cy="12" r="2.4" fill="#6a97d8" stroke="#0a260a" stroke-width="1"/>
  <circle cx="45" cy="34" r="1.8" fill="#6a97d8" stroke="#0a260a" stroke-width="1"/>
  <circle cx="3"  cy="38" r="2" fill="#6a97d8" stroke="#0a260a" stroke-width="1"/>
  <!-- 웅덩이 body (불규칙 타원) -->
