<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 화분 식물 · 3-잎 형태 + 하이라이트 + 나무 화분 -->
  <defs>
    <radialGradient id="leaf-a" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#c7e06a"/>
      <stop offset="1" stop-color="#8bac0f"/>
    </radialGradient>
  </defs>
  <!-- 왼쪽 잎 -->
  <ellipse cx="14" cy="18" rx="7" ry="10" fill="url(#leaf-a)" stroke="#0a260a" stroke-width="2" transform="rotate(-25 14 18)"/>
  <!-- 오른쪽 잎 -->
  <ellipse cx="34" cy="18" rx="7" ry="10" fill="url(#leaf-a)" stroke="#0a260a" stroke-width="2" transform="rotate(25 34 18)"/>
  <!-- 중앙 잎 (앞) -->
  <ellipse cx="24" cy="14" rx="6" ry="12" fill="url(#leaf-a)" stroke="#0a260a" stroke-width="2"/>
  <!-- 잎맥 (하이라이트) -->
  <line x1="24" y1="6" x2="24" y2="24" stroke="#c7e06a" stroke-width="1.2" opacity="0.7"/>
  <!-- 화분 (사다리꼴) -->
  <path d="M10,32 L38,32 L34,44 L14,44 Z" fill="#8b5a2b" stroke="#0a260a" stroke-width="2"/>
  <!-- 화분 상단 테두리 -->
  <path d="M9,29 L39,29 L38,33 L10,33 Z" fill="#a56d34" stroke="#0a260a" stroke-width="2"/>
  <!-- 흙 표면 -->
  <ellipse cx="24" cy="30.5" rx="14" ry="1.6" fill="#5a3a1a"/>
</svg>
