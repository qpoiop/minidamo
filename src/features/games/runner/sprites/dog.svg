<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 개 · 옆모습 · 귀 + 눈 + 몸통 + 4다리 + 꼬리 -->
  <defs>
    <linearGradient id="dog-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6b3a"/>
      <stop offset="1" stop-color="#5a3f1e"/>
    </linearGradient>
  </defs>
  <!-- 꼬리 -->
  <path d="M6,20 Q3,14 6,10 Q9,12 8,18 Z" fill="url(#dog-body)" stroke="#0a260a" stroke-width="1.8"/>
  <!-- 몸통 (타원) -->
  <ellipse cx="22" cy="24" rx="14" ry="8" fill="url(#dog-body)" stroke="#0a260a" stroke-width="2"/>
  <!-- 목 · 머리 연결 -->
  <path d="M32,22 L38,18 L42,20 L40,28 L34,28 Z" fill="url(#dog-body)" stroke="#0a260a" stroke-width="2"/>
  <!-- 머리 -->
  <circle cx="39" cy="20" r="6" fill="url(#dog-body)" stroke="#0a260a" stroke-width="2"/>
  <!-- 귀 (한쪽) -->
  <path d="M37,14 L34,8 L40,12 Z" fill="#5a3f1e" stroke="#0a260a" stroke-width="1.5"/>
  <!-- 코 -->
  <circle cx="44" cy="20" r="1.8" fill="#0a260a"/>
  <!-- 눈 -->
  <circle cx="41" cy="18" r="1.3" fill="#0a260a"/>
  <!-- 앞다리 2개 -->
  <rect x="14" y="30" width="3.5" height="10" fill="url(#dog-body)" stroke="#0a260a" stroke-width="1.5"/>
  <rect x="20" y="30" width="3.5" height="10" fill="url(#dog-body)" stroke="#0a260a" stroke-width="1.5"/>
  <!-- 뒷다리 2개 -->
  <rect x="27" y="30" width="3.5" height="10" fill="url(#dog-body)" stroke="#0a260a" stroke-width="1.5"/>
  <rect x="32" y="30" width="3.5" height="10" fill="url(#dog-body)" stroke="#0a260a" stroke-width="1.5"/>
  <!-- 발바닥 (짙게) -->
  <rect x="13" y="39" width="5.5" height="2" fill="#0a260a"/>
  <rect x="19" y="39" width="5.5" height="2" fill="#0a260a"/>
  <rect x="26" y="39" width="5.5" height="2" fill="#0a260a"/>
  <rect x="31" y="39" width="5.5" height="2" fill="#0a260a"/>
</svg>
