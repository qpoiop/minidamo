# minidamo signaling Worker
# Deploy: `cd worker && npx wrangler deploy`
#
# 기본 스토리지 = Workers KV (무료 플랜 즉시 사용, expirationTtl 네이티브 지원).
# R2로 전환하고 싶다면 아래 [[r2_buckets]] 블록을 활성화하고 [[kv_namespaces]]를 지운 뒤
# src/index.ts 상단의 STORAGE 상수를 'r2'로 바꾸세요.

name = "minidamo-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# --- KV (기본) ---
# 사용자가 실제 namespace id 두 개 붙이면 됨.
[[kv_namespaces]]
binding = "ROOMS_KV"
id = "e6795eb366314d9bbf84ceb1c049aaa4"
preview_id = "89278b7e431243f9b8c460efd3294124"

# --- R2 (선택) ---
# [[r2_buckets]]
# binding = "ROOMS_BUCKET"
# bucket_name = "minidamo-rooms"
# preview_bucket_name = "minidamo-rooms-dev"

# --- Env vars ---
[vars]
ROOM_TTL_SECONDS = "60"
ALLOWED_ORIGIN = "*"

# --- 만료 청소 (KV는 자체 TTL이 있어 필수 아님, 하지만 안전망) ---
[triggers]
crons = ["*/5 * * * *"]
